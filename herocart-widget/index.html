<html>
  <head>
    <link rel="stylesheet" href="style.css">
  </head>
  
  <div id="hc-overlay"></div>

  <div id="hc-drawer">

    <div class="hc-header">
      <h2>Your Cart</h2>

      <button id="hc-close">
        ✕
      </button>
    </div>

    
    <div id="hc-items"></div>
    
    <div class="hc-total-savings">
      <span>Total Savings</span>
      <span id="hc-total-savings">
        $0.00
      </span>
    </div>
    
    <div class="hc-summary-row">
      <span>
        Subtotal
      </span>
    
      <span id="hc-subtotal">
        $0.00
      </span>
    </div>
    
    <div class="hc-footer">
      <button id="hc-checkout"></button>
      <div id="hc-payment-methods"></div>
    </div>

  </div>

  <div class="hc-skeleton">

    <div class="hc-skeleton-image"></div>
  
    <div class="hc-skeleton-content">
  
      <div class="hc-skeleton-title"></div>
  
      <div class="hc-skeleton-variant"></div>
  
      <div class="hc-skeleton-quantity"></div>
  
    </div>
  
  </div>
</html>
