<div id="hc-overlay"></div>

<div id="hc-drawer">

  <div class="hc-header">
    <h2>Your Cart</h2>

    <button id="hc-close">
      ✕
    </button>
  </div>

  <div id="hc-cart-view">

    <div id="hc-items"></div>

    <div id="hc-cart-footer">

      <div class="hc-total-savings">
        <span>Total Savings</span>

        <span id="hc-total-savings">
          $0.00
        </span>
      </div>

      <div class="hc-summary-row">
        <span>
          Subtotal
        </span>

        <span id="hc-subtotal">
          $0.00
        </span>
      </div>

      <div class="hc-footer">
        <button id="hc-checkout"></button>

        <div id="hc-payment-methods"></div>
      </div>

    </div>
  </div>

  <div id="hc-empty-view" class="hc-hidden">

    <div class="hc-empty">

      <div class="hc-empty-icon">
        🛒
      </div>

      <h3 class="hc-empty-title">
        Your cart is empty
      </h3>

      <p class="hc-empty-description">
        Looks like you haven't added
        anything yet.
      </p>

      <a
        href="/"
        class="hc-empty-button"
      >
        Continue Shopping
      </a>

    </div>

  </div>

</div>
